# Declarative package inventory for rebuild.ps1
# Prefer C:\Programs when the installer allows a custom root.
# Exceptions (Program Files / Local\Programs) are documented in docs/PATHS.md.

dev:
  winget:
    - id: Git.Git
      notes: Often installs under Program Files; acceptable exception
    - id: GitHub.cli
    - id: Microsoft.PowerShell
    - id: Notepad++.Notepad++
      location: C:\Programs\Notepad++
    - id: JesseDuffield.lazygit
      optional: true
  scoop:
    - name: ripgrep
    - name: fd
    - name: jq
    - name: starship
      optional: true
  manual:
    - name: cmder
      path: C:\Programs\cmder
      notes: Auto-installed by machine/Install-Cmder.ps1 when missing; Update-Clink.ps1 refreshes bundled Clink + themes; configs via Apply-Cmder.ps1
    - name: hack-nerd-font
      notes: Auto-installed by machine/Install-HackNerdFont.ps1
    - name: intellij
      notes: JetBrains Toolbox / manual - document in PATHS.md

agent:
  manual:
    - name: OpenWhispr
      path: '%LOCALAPPDATA%\Programs\OpenWhispr\OpenWhispr.exe'
      notes: Soft check via Ensure-OpenWhispr.ps1; manual install if missing (OPENWHISPR-SETUP.md)
    - name: Cursor
      notes: AI harness / agent UI; settings + rules applied from dotfiles/cursor when Cursor is present
